spring:
  config:
    activate:
      on-profile: "local"

  # 이미 테이블이 있는 로컬 DB는 개발 서버와 같이 V1을 적용된 것으로 표시한다(LLD-0154).
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: false
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type: trace
observability:
  error-response:
    include-debug-details: true
