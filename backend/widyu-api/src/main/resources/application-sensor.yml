# Raw Sensor Batch Configuration (LLD-0041, LLD-0046)
sensor:
  # 원문 바이트 상한. 50Hz 1초 배치가 2KB 안팎이라 32KB면 충격 보강 배치까지 들어간다.
  max-payload-bytes: ${SENSOR_MAX_PAYLOAD_BYTES:32768}
  # 워치에 내려보내는 수집 설정. collection_mode는 열린 회차가 있으면 그 회차를 따르고,
  # 없으면 default-collection-mode를 쓴다(#989). 운영은 product, 개발 서버는 research.
  config:
    gyro-mode: ${SENSOR_GYRO_MODE:continuous}
    acc-fs-hz: ${SENSOR_ACC_FS_HZ:50}
    batch-sec: 1
    impact-threshold-g: 1.8
    backfill-before-sec: 2
    backfill-after-sec: 10
    hr-upload-sec: 1
    location-move-sec: 5
    location-keepalive-sec: 60
    heartbeat-sec: 60
    # 워치가 설정을 다시 읽을 권고 주기. 실제 주기는 앱 정책이다(FE F9).
    refresh-sec: 60
    default-collection-mode: ${SENSOR_DEFAULT_COLLECTION_MODE:product}

  # 회차 내보내기(LLD-0050). 값 집합이 미정인 상수는 여기서 바꾼다.
  export:
    poll-delay-ms: ${SENSOR_EXPORT_POLL_DELAY_MS:5000}
    # RUNNING 선점 뒤 프로세스가 죽으면 이 시간이 지난 잡을 다시 QUEUED로 돌린다.
    running-timeout-ms: ${SENSOR_EXPORT_RUNNING_TIMEOUT_MS:900000}
    presign-minutes: 15
    server-build: ${SENSOR_EXPORT_SERVER_BUILD:unknown}
    # 기대 샘플 간격(ms). expected_sample_count = 배정 구간 / 간격이며 자료가 없다고 줄이지 않는다(ADR-0032 결정 4).
    expected-period-ms:
      imu_watch: 20
      imu_phone: 20
      hr: 1000
      location: 60000
      heartbeat: 60000
    # 이 공백을 넘으면 missing_intervals로 신고한다.
    gap-threshold-ms:
      imu_watch: 5000
      imu_phone: 5000
      hr: 5000
      location: 120000
      heartbeat: 120000
    clock:
      source-domain: DEVICE_MONOTONIC
      target-domain: UTC_EPOCH_MS
      transform: ANCHOR_PAIR
      evidence-method: APP_REPORTED_ANCHOR
    absent-reason-role-missing: NO_DEVICE_ASSIGNED
    absent-reason-no-data: NO_DATA_IN_THIS_RUN

  # 심박 판정기의 이름과 판. AI 응답에 없어 여기서 적는다. AI 이미지 태그와 손으로 맞춘다(ADR-0035).
  heart-ai:
    decider-id: ${SENSOR_HEART_AI_DECIDER_ID:widyu-ai-hr}
    decider-version: ${SENSOR_HEART_AI_DECIDER_VERSION:ver7}
    # 착용이 확실하지 않은 심박은 판정하지 않는다(LLD-0126). 앱 #109 실기기 확인 뒤 켠다.
    wear-gate-enabled: ${SENSOR_HEART_AI_WEAR_GATE_ENABLED:false}
    # 손목 움직임 활동 상태를 AI context로 보낸다(LLD-0138). 꺼져 있으면 지금처럼 UNKNOWN이다.
    # 지금 AI는 REST가 오면 고정 기준(40 이하, 150 이상)을 꺼 쉬는 중 급락을 늦게 잡는다.
    # AI가 「고정 기준은 어떤 상태에서도 유지」(노션 3-1)를 배포하고 ADR-0042 결정 4의 검증을 마치기 전에는 켜지 않는다.
    activity-context-enabled: ${SENSOR_HEART_AI_ACTIVITY_CONTEXT_ENABLED:false}

  # 손목 움직임 5초 구간 활동 상태(LLD-0138, ADR-0042 결정 6). 연구팀 후보 값이라 규칙 문서가 오면 바꾼다.
  # 움직임 크기 = 구간 안 (가속도 벡터 크기 - 1g)의 표준편차(g). rest-max-g 미만 REST, active-min-g 이상 ACTIVE, 사이는 LOW.
  activity:
    window-sec: 5
    # 50Hz면 구간당 250개다. 이보다 적은 구간은 상태를 정하지 않고 심박에 UNKNOWN이 붙는다.
    min-window-samples: ${SENSOR_ACTIVITY_MIN_WINDOW_SAMPLES:125}
    rest-max-g: ${SENSOR_ACTIVITY_REST_MAX_G:0.04}
    active-min-g: ${SENSOR_ACTIVITY_ACTIVE_MIN_G:0.20}
    # 마지막 ACTIVE 구간이 끝난 뒤 이 시간 안이면 REST·LOW 대신 RECOVERY다.
    recovery-sec: ${SENSOR_ACTIVITY_RECOVERY_SEC:600}
    # 이 시간 전후 위치가 모두 이 속도를 넘으면 IN_VEHICLE. 정확도가 이 값(m)보다 나쁜 위치는 보지 않는다.
    vehicle-speed-kmh: ${SENSOR_ACTIVITY_VEHICLE_SPEED_KMH:20}
    vehicle-sec: ${SENSOR_ACTIVITY_VEHICLE_SEC:60}
    vehicle-max-accuracy-m: ${SENSOR_ACTIVITY_VEHICLE_MAX_ACCURACY_M:50}

  # 본인확인 선행은 시니어 앱 준비 뒤 운영에서 켠다(LLD-0070).
  incident:
    self-check-sec: ${SENSOR_INCIDENT_SELF_CHECK_SEC:60}
    timeout-poll-ms: ${SENSOR_INCIDENT_TIMEOUT_POLL_MS:5000}
    self-check-first: ${SENSOR_INCIDENT_SELF_CHECK_FIRST:false}
    situation-window-min: ${SENSOR_INCIDENT_SITUATION_WINDOW_MIN:5}
    # 확인 화면 수신 완료가 이 시간 안에 없으면 무응답으로 본다(LLD-0085).
    prompt-wait-sec: ${SENSOR_INCIDENT_PROMPT_WAIT_SEC:90}

  followup:
    enabled: ${SENSOR_FOLLOWUP_ENABLED:false}
    reward-enabled: ${SENSOR_FOLLOWUP_REWARD_ENABLED:false}

  # 위듀 앱 기기 알람의 실기기 확인·배포 뒤 운영에서 끈다(LLD-0080).
  medication:
    on-time-push: ${SENSOR_MEDICATION_ON_TIME_PUSH:true}

  fall-ai:
    enabled: ${SENSOR_FALL_AI_ENABLED:false}
    path: ${SENSOR_FALL_AI_PATH:/api/fall}
    window-before-sec: ${SENSOR_FALL_AI_WINDOW_BEFORE_SEC:2}
    server-decider-id: ${SENSOR_FALL_AI_SERVER_DECIDER_ID:widyu-server}
    server-decider-version: ${SENSOR_FALL_AI_SERVER_DECIDER_VERSION:abstain-v1}
