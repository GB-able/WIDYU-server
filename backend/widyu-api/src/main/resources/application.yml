spring:
  application:
    name: WIDYU-backend
  # 영속성 컨텍스트와 DB 커넥션을 서비스 트랜잭션 동안만 연다(LLD-0106). 켜면 HTTP 요청이 응답을 다 쓸 때까지
  # 커넥션을 잡는다. 모든 프로파일(test 포함)에 같은 값을 적용하려고 공통 파일에 둔다.
  jpa:
    open-in-view: false
  profiles:
    group:
      local: "local, datasource, fcm, pay, s3"
      dev: "dev, datasource, fcm, pay, s3"
      prod: "prod, datasource, fcm, pay, s3"
      test: "test, fcm, pay, s3"

    include:
      - auth
      - security
      - coolsms
      - redis
      - imp
      - oauth
      - video
      - pay
      - medicine
      - actuator
      - ai
      - juso
      - sensor

admin:
  email: ${ADMIN_EMAIL}
  password: ${ADMIN_PASSWORD}

# 보호자의 위치 열람 통보 운영값(LLD-0056 4절, ADR-0036 결정 4)
location-access:
  # 같은 보호자의 반복 조회를 합치던 immediate-cooldown-min은 없앴다. 열람마다 즉시 통보한다(LLD-0130).
  # 미통보 기록을 묶어 내보내는 정기 요약. 하루 한 번 묶음은 동의가 있어도 안 되므로 끈다("-" = 등록 안 함, LLD-0130).
  # 남은 미통보 기록은 서버 시작 1분 뒤 한 번 요약으로 나간다.
  digest-cron: ${LOCATION_ACCESS_DIGEST_CRON:-}

# 처리방침 보관 기간 정리 작업(LLD-0136). 1단계는 테이블별 지울 대상 건수만 data_purge_log에 남기고 아무것도 지우지 않는다.
retention:
  purge:
    # false면 스케줄러 빈을 만들지 않는다. 건수 조회가 DB에 부담이 되면 끈다.
    enabled: ${RETENTION_PURGE_ENABLED:true}
    # 매일 03:30(Asia/Seoul).
    cron: ${RETENTION_PURGE_CRON:0 30 3 * * *}

# WebSocket 느린 처리 전용 실행기(LLD-0091). 스레드 수는 고정(core = max)이고 대기열이 차면 과부하 오류를 돌려준다.
websocket:
  executor:
    heart:
      # 심박은 세션당 1초에 1건. AI 정상 응답(실측 14~81ms)이면 스레드 1개가 초당 10건 이상을 처리한다.
      # AI가 읽기 타임아웃(10초)까지 걸리면 8스레드 처리량은 초당 0.8건이라, 그 이상은 과부하 오류로 돌려보낸다.
      threads: ${WS_HEART_THREADS:8}
      # 거절된 심박은 앱이 다시 보내지 않으면 저장되지 않으므로, 짧은 몰림(재연결 직후 등)은 대기열이 받아낸다.
      # 200건은 AI 정상(최대 81ms)일 때 약 2초 안에 비워진다. AI가 10초씩 걸리면 대기 시간이 수 분이 되므로 더 늘리지 않는다.
      queue-capacity: ${WS_HEART_QUEUE_CAPACITY:200}
    sensor:
      # 센서 배치는 스트림마다 1초에 1건. S3 PUT apiCallTimeout은 5초다.
      threads: ${WS_SENSOR_THREADS:8}
      # 오프라인 뒤 밀린 배치를 몰아 보내는 경우를 받는다. 배치 상한 32KB × 500 = 최대 16MB를 메모리에 잡는다.
      queue-capacity: ${WS_SENSOR_QUEUE_CAPACITY:500}
    outbound:
      # 응답 전송 전용. 운영 2 vCPU 기준 Spring 기본(CPU×2)과 같은 4다.
      threads: ${WS_OUTBOUND_THREADS:4}
      queue-capacity: ${WS_OUTBOUND_QUEUE_CAPACITY:1000}

# 같은 회원의 실시간 위치 처리를 한 번에 하나씩 실행하는 잠금(LLD-0139). 기다리는 위치는 수신 스레드(최대 16개)를 쥔다.
location:
  realtime:
    sequencer:
      # 최신 요청이 아닌 위치의 대기 수 상한. 더 늦게 잰 위치는 이 상한을 우회하므로 회원별 수신 스레드 점유 수의 절대 상한은 아니다.
      # 상한을 넘은 옛 위치는 원본만 저장하고 ACK를 보내지 않는다. 최신 요청 몰림의 스레드 독점은 LLD-0140 9절의 미해결 항목이다.
      max-waiting: ${LOCATION_SEQUENCER_MAX_WAITING:4}
      # 차례를 기다리는 최대 시간. 정상 처리는 수 ms이고, Redis 명령 제한(3초, ADR-0040)과 커넥션 대기 한도(3초)에 맞췄다.
      wait-timeout-ms: ${LOCATION_SEQUENCER_WAIT_TIMEOUT_MS:3000}
  stay-state:
    # 서버가 뜰 때 예전 Redis 체류 키와 안전구역 알림 표식을 MySQL 체류 상태로 한 번 옮긴다(LLD-0141). DB 행이 있으면 두고
    # Redis 키는 지우지 않는다. 옮긴 뒤에는 끄고 배포해도 된다.
    import-legacy-redis: ${LOCATION_STAY_IMPORT_LEGACY_REDIS:true}

# @Async 실행기 상한(LLD-0092). 운영 서버 1~2 vCPU, Hikari 커넥션 풀 기본 10 기준.
async:
  # 실행기를 지정하지 않은 @Async(위치 이벤트 등). 작업마다 DB 트랜잭션을 열므로 커넥션 2개까지만 쓴다.
  # 대기열이 차면 버리고 WARN·async.executor.rejected 카운터를 남긴다(위치는 약 1초 뒤 다음 갱신이 같은 판정을 다시 한다).
  default:
    pool-size: ${ASYNC_DEFAULT_POOL_SIZE:2}
    queue-capacity: ${ASYNC_DEFAULT_QUEUE_CAPACITY:100}
    await-termination-seconds: ${ASYNC_DEFAULT_AWAIT_SECONDS:10}
  # 영상 처리(FFmpeg 변환·썸네일, CPU 집약). 처리 중 DB 커넥션을 붙잡으므로 동시 2건으로 묶고,
  # 대기열이 차면 업로드 요청에 503(TEMPORARILY_BUSY)을 돌려준다. 서버 경유 업로드(multipart)는 대기 중에도 영상 임시 파일을 디스크에 둔다.
  album-video:
    pool-size: ${ASYNC_ALBUM_VIDEO_POOL_SIZE:2}
    queue-capacity: ${ASYNC_ALBUM_VIDEO_QUEUE_CAPACITY:10}
    await-termination-seconds: ${ASYNC_ALBUM_VIDEO_AWAIT_SECONDS:30}

swagger:
  version: ${SWAGGER_VERSION:0.0.1}
  url: ${SWAGGER_URL:http://localhost:8080}

springdoc:
  swagger-ui:
    urls-primary-name: 전체 API

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level traceId=%X{traceId:-none} [%thread] %logger{36} - %msg%n"
