name: Deploy to AWS EC2 using Docker

on:
  push:
    branches:
      - develop

env:
  DOCKER_IMAGE_NAME: ${{ secrets.DEV_DOCKER_IMAGE_NAME }}
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_SSH_USER: ec2-user
  PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
  CONTAINER_NAME: ${{ secrets.DEV_CONTAINER_NAME }}

jobs:
  build-and-push-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Build widyu-api module only
        run: ./gradlew :backend:widyu-api:clean :backend:widyu-api:bootJar --no-daemon

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Image (latest + sha)
        uses: docker/build-push-action@v6
        with:
          context: ./backend/widyu-api
          file: ./backend/widyu-api/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}

  deploy-to-ec2:
    name: Deploy to AWS EC2
    needs: build-and-push-docker
    runs-on: ubuntu-latest

    steps:
      - name: SSH into EC2 and deploy container
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_SSH_USER }}
          key: ${{ env.PRIVATE_KEY }}
          script: |
            set -e

            IMAGE=${{ env.DOCKER_IMAGE_NAME }}
            TAG=${{ github.sha }}     # 고유 SHA 태그로 롤백 가능
            NAME=${{ env.CONTAINER_NAME }}

            echo "Pulling image: ${IMAGE}:${TAG}"
            docker pull ${IMAGE}:${TAG}

            echo "Stopping existing container (if any)..."
            if [ "$(docker ps -q -f name=^/${NAME}$)" ]; then
              docker stop ${NAME}
            fi
            if [ "$(docker ps -aq -f name=^/${NAME}$)" ]; then
              docker rm ${NAME}
            fi

            echo "Cleaning old images..."
            docker image prune -f

            echo "Starting new container..."
            docker run -d --name ${NAME} \
              --env-file /home/ec2-user/.env \
              -e TZ=Asia/Seoul \
              -p 8080:8080 \
              --restart=always \
              ${IMAGE}:${TAG}

            echo "Deployment completed successfully ✅"
