name: Deploy to AWS EC2 using Docker Compose

on:
  push:
    branches:
      - develop

env:
  DOCKER_IMAGE_NAME: ${{ secrets.DEV_DOCKER_IMAGE_NAME }}
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_SSH_USER: ec2-user
  PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

jobs:
  build-and-push-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Build widyu-api module only
        run: ./gradlew :backend:widyu-api:clean :backend:widyu-api:bootJar --no-daemon

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Image (latest + sha)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}

  deploy-to-ec2:
    name: Deploy to AWS EC2
    needs: build-and-push-docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync compose files to EC2
        run: |
          printf "%s" "${{ env.PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem

          ssh -i private_key.pem -o StrictHostKeyChecking=no \
            ${{ env.EC2_SSH_USER }}@${{ env.EC2_HOST }} \
            "mkdir -p /home/ec2-user/widyu/nginx"

          rsync -avz -e "ssh -i private_key.pem -o StrictHostKeyChecking=no" \
            docker-compose.yml docker-compose.dev.yml \
            ${{ env.EC2_SSH_USER }}@${{ env.EC2_HOST }}:/home/ec2-user/widyu/

          rsync -avz -e "ssh -i private_key.pem -o StrictHostKeyChecking=no" \
            nginx/ \
            ${{ env.EC2_SSH_USER }}@${{ env.EC2_HOST }}:/home/ec2-user/widyu/nginx/
          
          rsync -avz --delete -e "ssh -i private_key.pem -o StrictHostKeyChecking=no" \
            scripts/ \
            ${{ env.EC2_SSH_USER }}@${{ env.EC2_HOST }}:/home/ec2-user/widyu/scripts/
  
          rm -f private_key.pem

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_SSH_USER }}
          key: ${{ env.PRIVATE_KEY }}
          script: |
            set -e

            cd /home/ec2-user/widyu

            # .env 파일 복사 및 Docker 이미지 정보 추가
            cp /home/ec2-user/.env .env
            echo "DOCKER_IMAGE_NAME=${{ env.DOCKER_IMAGE_NAME }}" >> .env
            echo "IMAGE_TAG=${{ github.sha }}" >> .env

            echo "🐳 Pulling Docker image..."
            docker pull ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}

            echo "🛑 Stopping existing containers..."
            docker compose -f docker-compose.yml -f docker-compose.dev.yml down || true

            echo "🚀 Starting new containers..."
            docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

            echo "⏳ Waiting for health check..."
            sleep 15

            echo "🏥 Checking application health..."
            for i in {1..30}; do
              if curl -f http://localhost/actuator/health > /dev/null 2>&1; then
                echo "✅ Deployment completed successfully!"
                docker image prune -f
                exit 0
              fi
              echo "Waiting for application to be ready... ($i/30)"
              sleep 2
            done

            echo "⚠️  Health check timeout. Checking logs..."
            docker compose -f docker-compose.yml -f docker-compose.dev.yml logs --tail=50 widyu-api
            exit 1
