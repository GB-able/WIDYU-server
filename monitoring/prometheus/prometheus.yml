global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'widyu-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # Docker 환경 (EC2): widyu-api:8080
      # 로컬 개발 환경: host.docker.internal:8080
      - targets: ['widyu-api:8080']
    scrape_interval: 5s

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 5s
