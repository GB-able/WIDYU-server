# Base configuration (공통 설정)
# - 로컬: docker compose up (자동으로 override 병합)
# - 개발: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# - 운영: docker compose -f docker-compose.yml -f docker-compose.prod.yml up

services:
  # Spring Boot Application (공통)
  widyu-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_IMAGE_NAME:-widyu-api}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # Spring Profile (오버라이드에서 지정)
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}

      # Database (공통)
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      DB_NAME: ${DB_NAME:-widyu_dev}
      MYSQL_USERNAME: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

      # Redis (공통)
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      # JWT (공통)
      JWT_ACCESS_TOKEN_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_TOKEN_EXPIRATION_TIME: ${JWT_ACCESS_EXPIRATION:-7200000}
      JWT_REFRESH_TOKEN_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_TOKEN_EXPIRATION_TIME: ${JWT_REFRESH_EXPIRATION:-6024800000}
      JWT_TEMPORARY_TOKEN_SECRET: ${JWT_TEMPORARY_SECRET}
      JWT_TEMPORARY_TOKEN_EXPIRATION_TIME: ${JWT_TEMPORARY_EXPIRATION:-1800000}

      # OAuth (공통)
      OAUTH_NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      OAUTH_NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      OAUTH_NAVER_REDIRECT_URI: ${NAVER_REDIRECT_URI}
      OAUTH_KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      OAUTH_KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI}
      OAUTH_KAKAO_ADMIN_KEY: ${KAKAO_ADMIN_KEY}
      OAUTH_APPLE_IOS_CLIENT_ID: ${APPLE_IOS_CLIENT_ID}
      OAUTH_APPLE_ANDROID_CLIENT_ID: ${APPLE_ANDROID_CLIENT_ID}
      OAUTH_APPLE_TEAM_ID: ${APPLE_TEAM_ID}
      OAUTH_APPLE_KEY_ID: ${APPLE_KEY_ID}
      OAUTH_APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY}
      OAUTH_APPLE_REDIRECT_URI: ${APPLE_REDIRECT_URI}

      # AWS S3 (공통)
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}

      # FCM (공통)
      FIREBASE_CONFIG_PATH: ${FCM_CONFIG_PATH}

      # SMS (공통)
      COOLSMS_API_KEY: ${COOLSMS_API_KEY}
      COOLSMS_API_SECRET: ${COOLSMS_API_SECRET}
      COOLSMS_PHONE: ${COOLSMS_FROM_NUMBER}

      # Payment (공통)
      PAYMENT_SECRET_KEY: ${PAYMENT_SECRET_KEY}

      # Medicine API (공통)
      MEDICINE_API_SERVICE_KEY: ${MEDICINE_API_KEY}

      # Swagger (공통)
      SWAGGER_VERSION: ${SWAGGER_VERSION:-1.0.0}
      SWAGGER_URL: ${SWAGGER_URL:-http://localhost}

    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - app_logs:/app/logs
    networks:
      - widyu-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Redis Cache (공통)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    ports:
      - "${HOST_REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    networks:
      - widyu-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Nginx Reverse Proxy (공통)
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
      - certbot_webroot:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    networks:
      - widyu-network
    depends_on:
      widyu-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Certbot (필요할 때만 docker compose run으로 실행)
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    networks:
      - widyu-network
    profiles:
      - manual  # 자동 시작 방지

networks:
  widyu-network:
    driver: bridge

volumes:
  redis_data:
  app_logs:
  nginx_logs:
  certbot_webroot:
  certbot_certs:
